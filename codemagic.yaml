workflows:
  ios-development:
    name: iOS Development Build
    max_build_duration: 60
    integrations:
      app_store_connect: Apple Developer Portal
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.thard.studymate
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.thard.studymate"
    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - thardhik2005@gmail.com
        notify:
          success: true
          failure: true
